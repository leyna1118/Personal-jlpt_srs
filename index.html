<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>日文單字 SRS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <h1>🈶 日文單字 SRS</h1>
  <nav class="nav-tabs">
    <button id="tabStudy" class="active" data-tab="study">📖 複習</button>
    <button id="tabManage" data-tab="manage">🗂 單字管理</button>
    <button id="tabSettings" data-tab="settings">⚙️ 設定 / 進度</button>
  </nav>
</header>

<main id="app">

  <!-- STUDY VIEW -->
  <section id="viewStudy" class="view">
    <div class="panel stat-panel">
      <div class="stat-grid">
        <div class="stat"><b id="statDrawn">0</b><span>今天抽了幾張</span></div>
        <div class="stat"><b id="statNew">0</b><span>今日新字 / 上限</span></div>
        <div class="stat"><b id="statDue">0</b><span>待複習</span></div>
        <div class="stat"><b id="statMastered">0</b><span>已學會</span></div>
      </div>
    </div>

    <div id="companionBar" class="companion-bar hidden"></div>

    <div class="panel" id="cardPanel">
      <div id="introCard" class="card-view hidden">
        <div class="card-tag">初次見面</div>
        <div class="word-main" id="introWord">-</div>
        <div class="word-reading" id="introReading"></div>
        <div class="word-meaning" id="introMeaning"></div>
        <div class="word-example" id="introExample"></div>
        <div class="intro-actions">
          <button id="introKnowBtn" class="btn ghost">已認識</button>
          <button id="introLearnBtn" class="btn primary">沒看過</button>
        </div>
      </div>

      <div id="quizCard" class="card-view hidden">
        <div class="card-tag" id="quizTypeTag"></div>
        <div class="quiz-stem" id="quizStem"></div>
        <button id="revealKanjiBtn" class="btn small ghost hidden">顯示漢字</button>

        <div id="quizMcOptions" class="mc-options hidden"></div>

        <div id="quizTypeInput" class="type-input hidden">
          <input type="text" id="typingAnswer" placeholder="輸入假名讀音" autocomplete="off" autocapitalize="off">
          <button id="submitTyping" class="btn primary">送出</button>
        </div>

        <div id="quizFeedback" class="quiz-feedback hidden">
          <div class="feedback-result" id="feedbackResult"></div>
          <div class="answer-card">
            <div class="answer-word" id="answerWord"></div>
            <div class="answer-reading" id="answerReading"></div>
            <div class="answer-meaning" id="answerMeaning"></div>
            <div class="answer-example" id="answerExample"></div>
          </div>
          <div class="feedback-actions">
            <button id="masterBtn" class="btn small ghost">完全會了</button>
            <button id="nextCardBtn" class="btn primary">下一張</button>
          </div>
        </div>
      </div>

      <div id="emptyState" class="empty-state hidden"></div>
    </div>
  </section>

  <!-- MANAGE VIEW -->
  <section id="viewManage" class="view hidden">
    <div class="panel">
      <div class="section-title">分類進度(點格子可篩選下方清單)</div>
      <div id="categoryGrid" class="category-grid"></div>
    </div>
    <div class="panel">
      <div class="toolbar">
        <div class="section-title" style="margin:0;">單字清單</div>
        <div class="filter-row">
          <input type="search" id="searchBox" placeholder="搜尋漢字 / 讀音 / 意思">
          <select id="statusFilter">
            <option value="all" selected>全部狀態</option>
            <option value="mastered">已學會</option>
            <option value="learning">學習中</option>
            <option value="new">還沒學</option>
          </select>
        </div>
      </div>
      <div id="activeCatFilter" class="active-filter hidden">
        <span id="activeCatLabel"></span>
        <button id="clearCatFilter" class="btn small ghost">清除篩選</button>
      </div>
      <div class="muted" id="listCount" style="margin-bottom:8px;"></div>
      <div class="list-wrap">
        <table>
          <thead><tr><th>單字</th><th>讀音</th><th>意思</th><th>等級</th><th>狀態</th><th></th></tr></thead>
          <tbody id="listBody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- SETTINGS VIEW -->
  <section id="viewSettings" class="view hidden">
    <div class="panel">
      <div class="section-title">學習範圍</div>
      <div class="row" id="categoryChips"></div>
    </div>
    <div class="panel">
      <div class="section-title">每日新字安全上限</div>
      <p class="muted">超過這個數字就不再跳出新字介紹卡(學習中的字複習不受影響),你隨時可以調整。</p>
      <input type="number" id="dailyCapInput" min="0" max="300" style="width:80px;">
    </div>
    <div class="panel">
      <div class="section-title">💾 匯出 / 匯入進度</div>
      <p class="muted">進度會自動存在這台電腦這個瀏覽器裡。換裝置或想備份時,可以匯出成檔案,之後再匯入回來。</p>
      <div class="row">
        <button id="exportBtn" class="btn primary">匯出進度檔</button>
        <button id="importBtn" class="btn ghost">匯入進度檔</button>
        <input type="file" id="importFile" accept="application/json" class="hidden">
      </div>
    </div>
    <div class="panel">
      <div class="section-title">⚠️ 重設</div>
      <p class="muted">清空所有複習紀錄,恢復成全新狀態(不可復原,請先匯出備份)。</p>
      <button id="resetBtn" class="btn danger">重設全部進度</button>
    </div>
    <div class="panel">
      <div class="section-title">資料來源</div>
      <p class="muted">單字資料取自 <a href="https://github.com/5mdld/anki-jlpt-decks" target="_blank" rel="noopener">5mdld/anki-jlpt-decks</a>(CC BY-NC 4.0)。</p>
    </div>
  </section>

</main>

<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
